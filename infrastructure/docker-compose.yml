version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: urbanmove-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: urbanmove
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d urbanmove"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.0
    container_name: urbanmove-aws
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,sns,lambda
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"

  inventory-service:
    build: ../services/inventory
    container_name: urbanmove-inventory
    restart: on-failure
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/inventory_db
      - AWS_ENDPOINT_URL=http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3

  availability-service:
    build: ../services/availability
    container_name: urbanmove-availability
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/availability_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3

  telemetry-service:
    build: ../services/telemetry
    container_name: urbanmove-telemetry
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/telemetry_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3

  incidents-service:
    build: ../services/incidents
    container_name: urbanmove-incidents
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/incidents_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3

  maintenance-service:
    build: ../services/maintenance
    container_name: urbanmove-maintenance
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/maintenance_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3

  relocation-service:
    build: ../services/relocation
    container_name: urbanmove-relocation
    ports:
      - "8006:8006"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/relocation_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3

  acquisitions-service:
    build:
      context: ..
      dockerfile: services/acquisitions/Dockerfile
    container_name: urbanmove-acquisitions
    ports:
      - "8007:8007"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/acquisitions_db
      - AWS_ENDPOINT_URL=http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3

  maintenance-app:
    build: ../frontend/maintenance-app
    container_name: urbanmove-maintenance-app
    ports:
      - "3002:80"
    restart: on-failure