version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: urbanmove-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: urbanmove
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d urbanmove"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.0
    container_name: urbanmove-aws
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,sns,lambda
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"

  inventory-service:
    build: ../services/inventory
    container_name: urbanmove-inventory
    restart: on-failure
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/inventory_db
      - AWS_ENDPOINT_URL=http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3