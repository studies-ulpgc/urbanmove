name: UrbanMove CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy boto3 httpx pydantic ruff

      - name: Check code style with Ruff
        run: ruff check shared/ services/ lambdas/

      - name: Run shared tests
        run: python -m unittest discover -s shared -p "test_*.py"

      - name: Run unit tests for all services and lambdas
        run: |
          for dir in services/*/ lambdas/*/; do
            echo "Testing $dir"
            (cd "$dir" && python -m unittest discover -p "test_*.py")
          done

      - name: Package Lambdas artifacts
        run: |
          mkdir -p dist
          for lambda_dir in lambdas/*/; do
            if [ -f "${lambda_dir}handler.py" ]; then
              name=$(basename "$lambda_dir")
              zip -r "dist/${name}.zip" shared/ -x "shared/__pycache__/*"
              (cd "$lambda_dir" && zip -r "../../dist/${name}.zip" handler.py)
            fi
          done

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Inventory Docker image
        run: docker build -f services/inventory/Dockerfile -t urbanmove-inventory:ci .

      - name: Build Availability Docker image
        run: docker build -f services/availability/Dockerfile -t urbanmove-availability:ci .

      - name: Build Telemetry Docker image
        run: docker build -f services/telemetry/Dockerfile -t urbanmove-telemetry:ci .

      - name: Build Incidents Docker image
        run: docker build -f services/incidents/Dockerfile -t urbanmove-incidents:ci .

      - name: Build Maintenance Docker image
        run: docker build -f services/maintenance/Dockerfile -t urbanmove-maintenance:ci .

      - name: Build Relocation Docker image
        run: docker build -f services/relocation/Dockerfile -t urbanmove-relocation:ci .

      - name: Build Acquisitions Docker image
        run: docker build -f services/acquisitions/Dockerfile -t urbanmove-acquisitions:ci .