name: UrbanMove CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy boto3 httpx pydantic ruff

      - name: Check code style with Ruff
        run: ruff check services/

      - name: Run unit tests for all services
        run: |
          for service_dir in services/*/; do
            echo "Testing $service_dir"
            (cd "$service_dir" && python -m unittest discover -p "test_*.py")
          done

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Inventory Docker image
        run: docker build -t urbanmove-inventory:ci ./services/inventory